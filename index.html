<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Mahmoud Magdy Mansour — Flutter Developer</title>
    <meta name="description" content="Mahmoud Magdy Mansour is a Flutter Developer specializing in Clean Architecture, BLoC state management, Firebase, and high-performance cross-platform mobile engineering." />
    <meta name="keywords" content="Mahmoud Magdy Mansour, Flutter Developer, Dart, Clean Architecture, BLoC, Firebase, Mobile Development, Flutter Engineer, Egypt" />
    <meta name="author" content="Mahmoud Magdy Mansour" />
    <meta name="robots" content="index, follow" />
    <!-- H-6 Fix: canonical points to actual portfolio URL, not GitHub profile -->
    <link rel="canonical" href="https://mahmoudmagdy.dev/" />

    <!-- Open Graph — H-6 Fix: URLs updated to real portfolio domain -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mahmoudmagdy.dev/" />
    <meta property="og:title" content="Mahmoud Magdy Mansour — Flutter Developer" />
    <meta property="og:description" content="Flutter Developer specializing in Clean Architecture, BLoC state management, and high-performance mobile engineering." />
    <!-- Add an actual 1200×630 image to public/og-image.jpg before deploying -->
    <meta property="og:image" content="https://mahmoudmagdy.dev/og-image.jpg" />
    <meta property="og:site_name" content="Mahmoud Magdy Mansour Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mahmoudmagdy.dev/" />
    <meta name="twitter:title" content="Mahmoud Magdy Mansour — Flutter Developer" />
    <meta name="twitter:description" content="Flutter Developer specializing in Clean Architecture, BLoC state management, and high-performance mobile engineering." />
    <meta name="twitter:image" content="https://mahmoudmagdy.dev/og-image.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Mahmoud Magdy Mansour",
      "jobTitle": "Flutter Developer",
      "url": "https://mahmoudmagdy.dev/",
      "sameAs": [
        "https://github.com/MahmoudMagdy001",
        "https://linkedin.com/in/mahmoud-magdy-mansour"
      ],
      "knowsAbout": ["Flutter", "Dart", "Firebase", "Clean Architecture", "BLoC Pattern", "Mobile Development", "Hive", "FCM", "Local Notifications"],
      "description": "Flutter Developer specializing in Clean Architecture, BLoC, and performance-first mobile engineering."
    }
    </script>

    <!-- Google Fonts — M-9 Fix: preload the most critical weight (700/800 headings) first -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical heading weight to reduce FOUT -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" />
    <!-- Full font load -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#020617" />
  </head>
  <body>
    <div id="root"></div>
